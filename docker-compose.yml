version: '3.8'

services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      # - DATABASE_URL=postgresql://user:password@db:5432/mydb # 예시: 실제 DB 연결 정보로 변경 필요
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./data:/usr/src/app/data # 데이터 영속성을 위해 마운트 (선택 사항)
    # /health 엔드포인트로 컨테이너 상태 확인(DB 연결까지 검증). curl 미설치 환경 대비 node로 호출.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
